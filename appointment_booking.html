    <form id="appointment-form">
    <!-- Step 1 -->
    <div class="form-step step-1 active">
        <h5>Step 1: Contact Information</h5>
        <input type="text" name="from_name" placeholder="Full Name" required>
        <input type="email" name="from_email" placeholder="Email Address" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <button type="button" class="next-btn">Next</button>
    </div>

    <!-- Step 2 -->
    <div class="form-step step-2">
        <h5>Step 2: Appointment Type & Address</h5>
        <select name="appointment_type" required>
            <option selected disabled>Choose Appointment Type</option>
            <option>Consultation</option>
            <option>Follow-up</option>
            <option>Support Request</option>
            <option>Other</option>
        </select>
        <textarea name="notes" placeholder="Your Address or Notes" rows="4"></textarea>
        <button type="button" class="prev-btn">Back</button>
        <button type="button" class="next-btn">Next</button>
    </div>

    <!-- Step 3 -->
    <div class="form-step step-3">
        <h5>Step 3: Choose Date and Time</h5>
        <input type="date" name="date" required>
        <input type="time" name="time" required>
        <button type="button" class="prev-btn">Back</button>
        <button type="submit">Submit</button>
    </div>
</form>
